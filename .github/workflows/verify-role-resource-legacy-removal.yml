name: Verify role_resource legacy removal (proof pack)

on:
  push:
    branches: [sb4]
    paths:
      - 'tiny-oauth-server/**'
      - 'tiny-web/**'
      - '.github/workflows/verify-role-resource-legacy-removal.yml'
      - 'pom.xml'
  pull_request:
    branches: [sb4]
    paths:
      - 'tiny-oauth-server/**'
      - 'tiny-web/**'
      - '.github/workflows/verify-role-resource-legacy-removal.yml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CAMUNDA_PACKAGES_USERNAME: ${{ secrets.CAMUNDA_PACKAGES_USERNAME || github.actor }}
  CAMUNDA_PACKAGES_TOKEN: ${{ secrets.CAMUNDA_PACKAGES_TOKEN || github.token }}

jobs:
  proof-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 with Camunda fork packages
        uses: ./.github/actions/setup-camunda-fork-java
        with:
          java-version: "21"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run legacy removal proof pack
        run: bash tiny-oauth-server/scripts/verify-role-resource-legacy-removal-proof-pack.sh

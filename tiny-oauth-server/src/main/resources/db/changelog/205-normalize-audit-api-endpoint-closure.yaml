databaseChangeLog:
  - changeSet:
      id: 205-normalize-audit-api-endpoint-closure
      author: codex
      comment: 按作用域、HTTP 方法和 URI 补齐并校正认证/授权审计 API 载体及精确权限 requirement
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - and:
            - tableExists:
                tableName: tenant
            - tableExists:
                tableName: permission
            - tableExists:
                tableName: api_endpoint
            - tableExists:
                tableName: api_endpoint_permission_requirement
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: false
            sql: |
              -- 先建立完整的审计权限模板。只插入缺失行，不改变既有权限的 enabled，
              -- 也不在本变更中授予任何角色；缺失模板优先继承已有租户权限的治理元数据。
              INSERT INTO `permission` (
                `permission_code`, `permission_name`, `module_code`, `action_code`,
                `permission_type`, `description`, `enabled`, `built_in_flag`, `tenant_id`,
                `created_by`, `created_at`, `updated_by`, `updated_at`
              )
              SELECT
                canonical_permission.`permission_code`,
                COALESCE(source_permission.`permission_name`, canonical_permission.`permission_name`),
                COALESCE(source_permission.`module_code`, 'system'),
                COALESCE(source_permission.`action_code`, canonical_permission.`action_code`),
                COALESCE(source_permission.`permission_type`, 'API'),
                COALESCE(source_permission.`description`, '审计控制面 API 的内置权限'),
                COALESCE(source_permission.`enabled`, 1),
                COALESCE(source_permission.`built_in_flag`, 1),
                NULL,
                NULL, CURRENT_TIMESTAMP, NULL, CURRENT_TIMESTAMP
              FROM (
                SELECT 'system:audit:authentication:view' AS `permission_code`,
                       '认证审计查看' AS `permission_name`, 'view' AS `action_code`
                UNION ALL SELECT 'system:audit:authentication:export', '认证审计导出', 'export'
                UNION ALL SELECT 'system:audit:auth:view', '授权审计查看', 'view'
                UNION ALL SELECT 'system:audit:auth:export', '授权审计导出', 'export'
                UNION ALL SELECT 'system:audit:auth:purge', '授权审计清理', 'purge'
              ) canonical_permission
              LEFT JOIN `permission` source_permission
                ON source_permission.`id` = (
                  SELECT MIN(candidate_permission.`id`)
                  FROM `permission` candidate_permission
                  WHERE candidate_permission.`tenant_id` IS NOT NULL
                    AND candidate_permission.`permission_code` = canonical_permission.`permission_code`
                )
              WHERE NOT EXISTS (
                SELECT 1
                FROM `permission` existing_permission
                WHERE existing_permission.`tenant_id` IS NULL
                  AND existing_permission.`permission_code` = canonical_permission.`permission_code`
              );

              -- 存量租户补齐缺失权限主数据，继承平台模板 enabled；既有 disabled 行不会被重启用。
              INSERT INTO `permission` (
                `permission_code`, `permission_name`, `module_code`, `action_code`,
                `permission_type`, `description`, `enabled`, `built_in_flag`, `tenant_id`,
                `created_by`, `created_at`, `updated_by`, `updated_at`
              )
              SELECT
                platform_permission.`permission_code`, platform_permission.`permission_name`,
                platform_permission.`module_code`, platform_permission.`action_code`,
                platform_permission.`permission_type`, platform_permission.`description`,
                platform_permission.`enabled`, platform_permission.`built_in_flag`, tenant_entry.`id`,
                NULL, CURRENT_TIMESTAMP, NULL, CURRENT_TIMESTAMP
              FROM `tenant` tenant_entry
              JOIN `permission` platform_permission
                ON platform_permission.`tenant_id` IS NULL
               AND platform_permission.`permission_code` IN (
                 'system:audit:authentication:view',
                 'system:audit:authentication:export',
                 'system:audit:auth:view',
                 'system:audit:auth:export',
                 'system:audit:auth:purge'
               )
              WHERE NOT EXISTS (
                SELECT 1
                FROM `permission` tenant_permission
                WHERE tenant_permission.`tenant_id` = tenant_entry.`id`
                  AND tenant_permission.`permission_code` = platform_permission.`permission_code`
              );

              -- 不依赖历史 name：对同一 scope + method + uri 的现有载体统一校正。
              -- 这也会把大小写或首尾空白漂移的方法规范回标准 HTTP 方法。
              UPDATE `api_endpoint` endpoint_entry
              JOIN (
                SELECT NULL AS `tenant_id`, 'PLATFORM' AS `resource_level`
                UNION ALL
                SELECT tenant_entry.`id`, 'TENANT'
                FROM `tenant` tenant_entry
              ) target_scope
                ON endpoint_entry.`tenant_id` <=> target_scope.`tenant_id`
              JOIN (
                SELECT 'authentication-list' AS `route_key`, '查询认证审计日志' AS `title`,
                       '/sys/audit/authentication' AS `uri`, 'GET' AS `method`,
                       'system:audit:authentication:view' AS `permission_code`
                UNION ALL SELECT 'authentication-summary', '查询认证审计概览',
                       '/sys/audit/authentication/summary', 'GET',
                       'system:audit:authentication:view'
                UNION ALL SELECT 'authentication-export', '导出认证审计日志',
                       '/sys/audit/authentication/export', 'GET',
                       'system:audit:authentication:export'
                UNION ALL SELECT 'authorization-list', '查询授权审计日志',
                       '/sys/audit/authorization', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-summary', '查询授权审计概览',
                       '/sys/audit/authorization/summary', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-export', '导出授权审计日志',
                       '/sys/audit/authorization/export', 'GET',
                       'system:audit:auth:export'
                UNION ALL SELECT 'authorization-by-event-type', '按事件类型查询授权审计',
                       '/sys/audit/authorization/by-event-type', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-by-user', '按用户查询授权审计',
                       '/sys/audit/authorization/by-user/{userId}', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-purge', '清理授权审计日志',
                       '/sys/audit/authorization/purge', 'DELETE',
                       'system:audit:auth:purge'
              ) canonical_route
                ON UPPER(TRIM(endpoint_entry.`method`)) = canonical_route.`method`
               AND TRIM(endpoint_entry.`uri`) = canonical_route.`uri`
              JOIN `permission` required_permission
                ON required_permission.`tenant_id` <=> target_scope.`tenant_id`
               AND required_permission.`permission_code` = canonical_route.`permission_code`
              SET
                endpoint_entry.`resource_level` = target_scope.`resource_level`,
                endpoint_entry.`uri` = canonical_route.`uri`,
                endpoint_entry.`method` = canonical_route.`method`,
                endpoint_entry.`permission` = canonical_route.`permission_code`,
                endpoint_entry.`required_permission_id` = required_permission.`id`,
                endpoint_entry.`enabled` = 1,
                endpoint_entry.`updated_at` = CURRENT_TIMESTAMP;

              -- 对 PLATFORM 模板和每个现有 TENANT 插入仍然缺失的精确载体，包含 purge DELETE。
              INSERT INTO `api_endpoint` (
                `tenant_id`, `resource_level`, `name`, `title`, `uri`, `method`, `permission`,
                `required_permission_id`, `enabled`, `created_at`, `updated_at`
              )
              SELECT
                target_scope.`tenant_id`, target_scope.`resource_level`,
                CONCAT('audit-', canonical_route.`route_key`), canonical_route.`title`,
                canonical_route.`uri`, canonical_route.`method`, canonical_route.`permission_code`,
                required_permission.`id`, 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM (
                SELECT NULL AS `tenant_id`, 'PLATFORM' AS `resource_level`
                UNION ALL
                SELECT tenant_entry.`id`, 'TENANT'
                FROM `tenant` tenant_entry
              ) target_scope
              CROSS JOIN (
                SELECT 'authentication-list' AS `route_key`, '查询认证审计日志' AS `title`,
                       '/sys/audit/authentication' AS `uri`, 'GET' AS `method`,
                       'system:audit:authentication:view' AS `permission_code`
                UNION ALL SELECT 'authentication-summary', '查询认证审计概览',
                       '/sys/audit/authentication/summary', 'GET',
                       'system:audit:authentication:view'
                UNION ALL SELECT 'authentication-export', '导出认证审计日志',
                       '/sys/audit/authentication/export', 'GET',
                       'system:audit:authentication:export'
                UNION ALL SELECT 'authorization-list', '查询授权审计日志',
                       '/sys/audit/authorization', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-summary', '查询授权审计概览',
                       '/sys/audit/authorization/summary', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-export', '导出授权审计日志',
                       '/sys/audit/authorization/export', 'GET',
                       'system:audit:auth:export'
                UNION ALL SELECT 'authorization-by-event-type', '按事件类型查询授权审计',
                       '/sys/audit/authorization/by-event-type', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-by-user', '按用户查询授权审计',
                       '/sys/audit/authorization/by-user/{userId}', 'GET',
                       'system:audit:auth:view'
                UNION ALL SELECT 'authorization-purge', '清理授权审计日志',
                       '/sys/audit/authorization/purge', 'DELETE',
                       'system:audit:auth:purge'
              ) canonical_route
              JOIN `permission` required_permission
                ON required_permission.`tenant_id` <=> target_scope.`tenant_id`
               AND required_permission.`permission_code` = canonical_route.`permission_code`
              WHERE NOT EXISTS (
                SELECT 1
                FROM `api_endpoint` existing_endpoint
                WHERE existing_endpoint.`tenant_id` <=> target_scope.`tenant_id`
                  AND existing_endpoint.`resource_level` = target_scope.`resource_level`
                  AND UPPER(TRIM(existing_endpoint.`method`)) = canonical_route.`method`
                  AND TRIM(existing_endpoint.`uri`) = canonical_route.`uri`
              );

              -- 单端点只保留与控制器权限一致的 requirement，清除历史错误权限或错误组合组。
              DELETE requirement_entry
              FROM `api_endpoint_permission_requirement` requirement_entry
              JOIN `api_endpoint` endpoint_entry
                ON endpoint_entry.`id` = requirement_entry.`api_endpoint_id`
              JOIN (
                SELECT NULL AS `tenant_id`, 'PLATFORM' AS `resource_level`
                UNION ALL
                SELECT tenant_entry.`id`, 'TENANT'
                FROM `tenant` tenant_entry
              ) target_scope
                ON endpoint_entry.`tenant_id` <=> target_scope.`tenant_id`
               AND endpoint_entry.`resource_level` = target_scope.`resource_level`
              JOIN (
                SELECT '/sys/audit/authentication' AS `uri`, 'GET' AS `method`
                UNION ALL SELECT '/sys/audit/authentication/summary', 'GET'
                UNION ALL SELECT '/sys/audit/authentication/export', 'GET'
                UNION ALL SELECT '/sys/audit/authorization', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/summary', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/export', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/by-event-type', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/by-user/{userId}', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/purge', 'DELETE'
              ) canonical_route
                ON endpoint_entry.`method` = canonical_route.`method`
               AND endpoint_entry.`uri` = canonical_route.`uri`;

              INSERT INTO `api_endpoint_permission_requirement` (
                `tenant_id`, `api_endpoint_id`, `requirement_group`, `sort_order`, `permission_id`,
                `negated`, `created_at`, `updated_at`
              )
              SELECT
                endpoint_entry.`tenant_id`, endpoint_entry.`id`, 0, 1,
                endpoint_entry.`required_permission_id`, 0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM `api_endpoint` endpoint_entry
              JOIN (
                SELECT NULL AS `tenant_id`, 'PLATFORM' AS `resource_level`
                UNION ALL
                SELECT tenant_entry.`id`, 'TENANT'
                FROM `tenant` tenant_entry
              ) target_scope
                ON endpoint_entry.`tenant_id` <=> target_scope.`tenant_id`
               AND endpoint_entry.`resource_level` = target_scope.`resource_level`
              JOIN (
                SELECT '/sys/audit/authentication' AS `uri`, 'GET' AS `method`
                UNION ALL SELECT '/sys/audit/authentication/summary', 'GET'
                UNION ALL SELECT '/sys/audit/authentication/export', 'GET'
                UNION ALL SELECT '/sys/audit/authorization', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/summary', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/export', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/by-event-type', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/by-user/{userId}', 'GET'
                UNION ALL SELECT '/sys/audit/authorization/purge', 'DELETE'
              ) canonical_route
                ON endpoint_entry.`method` = canonical_route.`method`
               AND endpoint_entry.`uri` = canonical_route.`uri`
              WHERE endpoint_entry.`required_permission_id` IS NOT NULL;

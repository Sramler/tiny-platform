databaseChangeLog:
  - changeSet:
      id: 188-backfill-platform-tenant-control-api-endpoints
      author: codex
      comment: 补齐 PLATFORM 租户控制面基础 CRUD 与生命周期 api_endpoint，避免统一守卫对已授权 Session 请求 fail-closed
      preConditions:
        onFail: HALT
        onError: HALT
        and:
          - tableExists:
              tableName: permission
          - tableExists:
              tableName: api_endpoint
          - tableExists:
              tableName: api_endpoint_permission_requirement
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              INSERT INTO api_endpoint (
                tenant_id, resource_level, name, title, uri, method, permission,
                required_permission_id, enabled, created_at, updated_at
              )
              SELECT NULL, 'PLATFORM', CONCAT('tenant-control-', LOWER(spec.method), '-', REPLACE(REPLACE(spec.uri, '/', '-'), '{id}', 'id')),
                     spec.title, spec.uri, spec.method, spec.permission_code,
                     p.id, 1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM (
                SELECT '/sys/tenants' uri, 'GET' method, 'system:tenant:list' permission_code, '查询租户列表' title
                UNION ALL SELECT '/sys/tenants/{id}', 'GET', 'system:tenant:view', '读取租户详情'
                UNION ALL SELECT '/sys/tenants', 'POST', 'system:tenant:create', '创建租户'
                UNION ALL SELECT '/sys/tenants/{id}', 'PUT', 'system:tenant:edit', '更新租户'
                UNION ALL SELECT '/sys/tenants/platform-template/initialize', 'POST', 'system:tenant:template:initialize', '初始化平台租户模板'
                UNION ALL SELECT '/sys/tenants/{id}/freeze', 'POST', 'system:tenant:freeze', '冻结租户'
                UNION ALL SELECT '/sys/tenants/{id}/unfreeze', 'POST', 'system:tenant:unfreeze', '解冻租户'
                UNION ALL SELECT '/sys/tenants/{id}/decommission', 'POST', 'system:tenant:decommission', '下线租户'
                UNION ALL SELECT '/sys/tenants/{id}', 'DELETE', 'system:tenant:delete', '删除租户'
              ) spec
              JOIN permission p
                ON p.tenant_id IS NULL
               AND p.permission_code = spec.permission_code
              WHERE NOT EXISTS (
                SELECT 1 FROM api_endpoint existing
                WHERE existing.tenant_id IS NULL
                  AND existing.resource_level = 'PLATFORM'
                  AND existing.uri = spec.uri
                  AND existing.method = spec.method
              );

              INSERT IGNORE INTO api_endpoint_permission_requirement (
                tenant_id, api_endpoint_id, requirement_group, sort_order,
                permission_id, negated, created_at, updated_at
              )
              SELECT NULL, endpoint_entry.id, 0, 0,
                     endpoint_entry.required_permission_id, 0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM api_endpoint endpoint_entry
              WHERE endpoint_entry.tenant_id IS NULL
                AND endpoint_entry.resource_level = 'PLATFORM'
                AND endpoint_entry.required_permission_id IS NOT NULL
                AND (
                  (endpoint_entry.uri = '/sys/tenants' AND endpoint_entry.method IN ('GET', 'POST'))
                  OR (endpoint_entry.uri = '/sys/tenants/{id}' AND endpoint_entry.method IN ('GET', 'PUT', 'DELETE'))
                  OR (endpoint_entry.uri = '/sys/tenants/platform-template/initialize' AND endpoint_entry.method = 'POST')
                  OR (endpoint_entry.uri IN (
                    '/sys/tenants/{id}/freeze',
                    '/sys/tenants/{id}/unfreeze',
                    '/sys/tenants/{id}/decommission'
                  ) AND endpoint_entry.method = 'POST')
                );

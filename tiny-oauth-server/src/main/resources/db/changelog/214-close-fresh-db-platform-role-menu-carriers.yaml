databaseChangeLog:
  - changeSet:
      id: 214-close-fresh-db-platform-role-menu-carriers
      author: codex
      comment: 补齐 fresh DB 的 PLATFORM 角色/菜单页面与按钮载体，消除历史迁移先复制 ui_action、后创建平台菜单造成的时序缺口
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - and:
            - tableExists:
                tableName: menu
            - tableExists:
                tableName: ui_action
            - tableExists:
                tableName: permission
            - tableExists:
                tableName: role
            - tableExists:
                tableName: role_permission
            - tableExists:
                tableName: menu_permission_requirement
            - tableExists:
                tableName: ui_action_permission_requirement
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: false
            sql: |
              -- 150 号迁移复制 PLATFORM ui_action 时，fresh DB 尚无 /system/role 与
              -- /system/menu；205a 后续只显式创建了 /system/resource。这里先闭合页面载体。
              INSERT INTO `menu` (
                `tenant_id`, `resource_level`, `name`, `title`, `path`, `icon`, `show_icon`,
                `sort`, `component`, `redirect`, `hidden`, `keep_alive`, `permission`,
                `required_permission_id`, `type`, `parent_id`, `enabled`,
                `created_at`, `created_by`, `updated_at`, `updated_by`
              )
              SELECT
                NULL, 'PLATFORM', spec.`name`, spec.`title`, spec.`path`, spec.`icon`, 0,
                spec.`sort`, spec.`component`, '', 0, 0, spec.`permission_code`,
                platform_permission.`id`, 1, platform_system.`id`, 1,
                NOW(), NULL, NOW(), NULL
              FROM (
                SELECT
                  'role' AS `name`, '角色管理' AS `title`, '/system/role' AS `path`,
                  'TeamOutlined' AS `icon`, 1 AS `sort`, '/views/role/role.vue' AS `component`,
                  'system:role:list' AS `permission_code`
                UNION ALL
                SELECT
                  'menu', '菜单管理', '/system/menu', 'MenuOutlined', 2,
                  '/views/menu/Menu.vue', 'system:menu:list'
              ) spec
              JOIN `menu` platform_system
                ON platform_system.`tenant_id` IS NULL
               AND platform_system.`path` = '/system'
              JOIN `permission` platform_permission
                ON platform_permission.`tenant_id` IS NULL
               AND platform_permission.`permission_code` = spec.`permission_code`
               AND platform_permission.`enabled` = 1
              WHERE NOT EXISTS (
                SELECT 1
                FROM `menu` existing
                WHERE existing.`tenant_id` IS NULL
                  AND existing.`path` = spec.`path`
              );

              UPDATE `menu` platform_menu
              JOIN (
                SELECT
                  'role' AS `name`, '角色管理' AS `title`, '/system/role' AS `path`,
                  'TeamOutlined' AS `icon`, 1 AS `sort`, '/views/role/role.vue' AS `component`,
                  'system:role:list' AS `permission_code`
                UNION ALL
                SELECT
                  'menu', '菜单管理', '/system/menu', 'MenuOutlined', 2,
                  '/views/menu/Menu.vue', 'system:menu:list'
              ) spec
                ON spec.`path` = platform_menu.`path`
              JOIN `menu` platform_system
                ON platform_system.`tenant_id` IS NULL
               AND platform_system.`path` = '/system'
              JOIN `permission` platform_permission
                ON platform_permission.`tenant_id` IS NULL
               AND platform_permission.`permission_code` = spec.`permission_code`
               AND platform_permission.`enabled` = 1
              SET
                platform_menu.`resource_level` = 'PLATFORM',
                platform_menu.`name` = spec.`name`,
                platform_menu.`title` = spec.`title`,
                platform_menu.`icon` = spec.`icon`,
                platform_menu.`show_icon` = 0,
                platform_menu.`sort` = spec.`sort`,
                platform_menu.`component` = spec.`component`,
                platform_menu.`redirect` = '',
                platform_menu.`hidden` = 0,
                platform_menu.`keep_alive` = 0,
                platform_menu.`permission` = spec.`permission_code`,
                platform_menu.`required_permission_id` = platform_permission.`id`,
                platform_menu.`type` = 1,
                platform_menu.`parent_id` = platform_system.`id`,
                platform_menu.`enabled` = 1,
                platform_menu.`updated_at` = NOW(),
                platform_menu.`updated_by` = NULL
              WHERE platform_menu.`tenant_id` IS NULL;

              DELETE requirement_entry
              FROM `menu_permission_requirement` requirement_entry
              JOIN `menu` platform_menu
                ON platform_menu.`id` = requirement_entry.`menu_id`
              WHERE platform_menu.`tenant_id` IS NULL
                AND platform_menu.`path` IN ('/system/role', '/system/menu');

              INSERT INTO `menu_permission_requirement` (
                `tenant_id`, `menu_id`, `requirement_group`, `sort_order`, `permission_id`,
                `negated`, `created_at`, `created_by`, `updated_at`, `updated_by`
              )
              SELECT
                NULL, platform_menu.`id`, 0, 1, platform_menu.`required_permission_id`,
                0, NOW(), NULL, NOW(), NULL
              FROM `menu` platform_menu
              WHERE platform_menu.`tenant_id` IS NULL
                AND platform_menu.`path` IN ('/system/role', '/system/menu')
                AND platform_menu.`required_permission_id` IS NOT NULL;

              -- 150 号迁移已建立平台按钮 permission，但当时缺少目标 platform menu，
              -- 因此复制动作被 JOIN 过滤。沿用同一套 tenant 模板，幂等补齐两个页面的载体。
              INSERT INTO `ui_action` (
                `tenant_id`, `resource_level`, `name`, `title`, `action_key`, `page_path`,
                `permission`, `required_permission_id`, `parent_menu_id`, `sort`, `enabled`,
                `created_at`, `created_by`, `updated_at`, `updated_by`
              )
              SELECT
                NULL, 'PLATFORM', source_action.`name`, source_action.`title`,
                source_action.`action_key`, platform_menu.`path`, source_action.`permission`,
                platform_permission.`id`, platform_menu.`id`, source_action.`sort`,
                source_action.`enabled`, NOW(), NULL, NOW(), NULL
              FROM `ui_action` source_action
              JOIN `menu` source_menu
                ON source_menu.`id` = source_action.`parent_menu_id`
               AND source_menu.`tenant_id` <=> source_action.`tenant_id`
              JOIN (
                SELECT MIN(candidate.`id`) AS `source_ui_action_id`
                FROM `ui_action` candidate
                JOIN `menu` candidate_menu
                  ON candidate_menu.`id` = candidate.`parent_menu_id`
                 AND candidate_menu.`tenant_id` <=> candidate.`tenant_id`
                WHERE candidate.`tenant_id` IS NOT NULL
                  AND candidate_menu.`path` IN ('/system/role', '/system/menu')
                  AND candidate.`permission` IS NOT NULL
                  AND TRIM(candidate.`permission`) <> ''
                GROUP BY
                  candidate_menu.`path`,
                  CONVERT(TRIM(candidate.`permission`) USING utf8mb4) COLLATE utf8mb4_0900_ai_ci
              ) chosen
                ON chosen.`source_ui_action_id` = source_action.`id`
              JOIN `menu` platform_menu
                ON platform_menu.`tenant_id` IS NULL
               AND platform_menu.`path` = source_menu.`path`
              JOIN `permission` platform_permission
                ON platform_permission.`tenant_id` IS NULL
               AND platform_permission.`permission_code`
                   = CONVERT(TRIM(source_action.`permission`) USING utf8mb4) COLLATE utf8mb4_0900_ai_ci
               AND platform_permission.`enabled` = 1
              WHERE NOT EXISTS (
                SELECT 1
                FROM `ui_action` existing
                WHERE existing.`tenant_id` IS NULL
                  AND existing.`parent_menu_id` = platform_menu.`id`
                  AND existing.`permission` COLLATE utf8mb4_0900_ai_ci
                      = source_action.`permission` COLLATE utf8mb4_0900_ai_ci
              );

              UPDATE `ui_action` platform_action
              JOIN `menu` platform_menu
                ON platform_menu.`id` = platform_action.`parent_menu_id`
               AND platform_menu.`tenant_id` IS NULL
              JOIN `permission` platform_permission
                ON platform_permission.`tenant_id` IS NULL
               AND platform_permission.`permission_code`
                   = CONVERT(TRIM(platform_action.`permission`) USING utf8mb4) COLLATE utf8mb4_0900_ai_ci
              SET
                platform_action.`resource_level` = 'PLATFORM',
                platform_action.`page_path` = platform_menu.`path`,
                platform_action.`required_permission_id` = platform_permission.`id`,
                platform_action.`updated_at` = NOW(),
                platform_action.`updated_by` = NULL
              WHERE platform_menu.`path` IN ('/system/role', '/system/menu')
                AND platform_action.`permission` IS NOT NULL
                AND TRIM(platform_action.`permission`) <> '';

              INSERT IGNORE INTO `ui_action_permission_requirement` (
                `tenant_id`, `ui_action_id`, `requirement_group`, `sort_order`, `permission_id`,
                `negated`, `created_at`, `created_by`, `updated_at`, `updated_by`
              )
              SELECT
                NULL, platform_action.`id`, 0, 1, platform_action.`required_permission_id`,
                0, NOW(), NULL, NOW(), NULL
              FROM `ui_action` platform_action
              JOIN `menu` platform_menu
                ON platform_menu.`id` = platform_action.`parent_menu_id`
               AND platform_menu.`tenant_id` IS NULL
              WHERE platform_menu.`path` IN ('/system/role', '/system/menu')
                AND platform_action.`required_permission_id` IS NOT NULL;

              INSERT IGNORE INTO `role_permission` (
                `tenant_id`, `role_id`, `permission_id`, `created_by`, `created_at`
              )
              SELECT
                NULL, platform_admin.`id`, required_permission.`id`, NULL, NOW()
              FROM `role` platform_admin
              JOIN `permission` required_permission
                ON required_permission.`tenant_id` IS NULL
               AND required_permission.`enabled` = 1
              WHERE platform_admin.`tenant_id` IS NULL
                AND platform_admin.`role_level` = 'PLATFORM'
                AND platform_admin.`code` = 'ROLE_PLATFORM_ADMIN'
                AND (
                  required_permission.`permission_code` IN ('system:role:list', 'system:menu:list')
                  OR EXISTS (
                    SELECT 1
                    FROM `ui_action` platform_action
                    JOIN `menu` platform_menu
                      ON platform_menu.`id` = platform_action.`parent_menu_id`
                     AND platform_menu.`tenant_id` IS NULL
                    WHERE platform_menu.`path` IN ('/system/role', '/system/menu')
                      AND platform_action.`enabled` = 1
                      AND platform_action.`required_permission_id` = required_permission.`id`
                  )
                );

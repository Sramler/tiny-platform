databaseChangeLog:
  - changeSet:
      id: 216-reset-service-oauth-client-secret
      author: codex
      comment: Remove any previously persisted service client secret; startup re-registers the client only when TINY_SERVICE_CLIENT_SECRET is injected.
      changes:
        - delete:
            tableName: oauth2_authorization_consent
            where: registered_client_id IN (SELECT id FROM oauth2_registered_client WHERE client_id = 'tiny-service-client')
        - delete:
            tableName: oauth2_authorization
            where: registered_client_id IN (SELECT id FROM oauth2_registered_client WHERE client_id = 'tiny-service-client')
        - delete:
            tableName: oauth2_registered_client
            where: client_id = 'tiny-service-client'
